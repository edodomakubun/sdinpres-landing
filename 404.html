<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Halaman tidak ditemukan — SD Inpres Lelingluan</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    // Routing otomatis URL slug postingan: /post/:slug -> /praktik-baik.html?slug=:slug
    (function() {
      const path = window.location.pathname;
      if (path.startsWith('/post/')) {
        const slug = path.replace(/^\/post\//, '').replace(/\/$/, '');
        if (slug) {
          window.location.replace('/praktik-baik.html?slug=' + encodeURIComponent(slug));
        }
      }
    })();
  </script>
  <meta http-equiv="refresh" content="4;url=/">
  <style>
    body {
      margin: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #faf8ff;
      color: #131b2e;
      text-align: center;
    }
    main {
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 480px;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      background: #ffffff;
      border: 1px solid #c4c5d5;
      border-radius: 16px;
      padding: 8px;
      box-shadow: 0 4px 12px rgba(0, 40, 142, 0.08);
    }
    .badge {
      letter-spacing: .15em;
      font-weight: 700;
      font-size: 11px;
      color: #0051d5;
      margin: 0;
      text-transform: uppercase;
    }
    h1 {
      margin: 4px 0 8px;
      font-size: 26px;
      font-weight: 800;
      color: #00288e;
    }
    p {
      color: #444653;
      font-size: 14px;
      margin: 0;
      line-height: 1.6;
    }
    a {

      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <img class="brand-logo" src="assets/logo.png" alt="Logo SD Inpres Lelingluan">
    <p class="badge">SD INPRES LELINGLUAN</p>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Halaman yang Anda tuju sedang tidak tersedia atau telah dipindahkan. Sistem akan mengalihkan Anda secara otomatis ke <a href="/">halaman beranda</a>…</p>
